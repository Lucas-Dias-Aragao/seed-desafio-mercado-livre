server:
  port: 8078

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    properties:
      hibernate:
        default_schema: marketplace
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always
      platform: h2
      schema-locations: classpath:schema-test.sql
