server:
  port: 3011

spring:
  application:
    name: marketplace

  datasource:
    url: jdbc:postgresql://localhost:5432/marketplace_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    database-plataform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
